name: Comprobar juego
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - name: Generate shared engine fixtures
        run: npm run test:sql:generate
      - name: Verify database engine and API permissions in isolated PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/bootstrap.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/schema.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/classic_v1.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/onboarding_v1.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 --single-transaction -f tmp/classic-tests.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 --single-transaction -f tests/onboarding.sql
      - name: Verify parallel command retries
        env:
          PGPASSWORD: postgres
          REALM_TEST_DATABASE: ephemeral
        run: node scripts/test-concurrency.mjs
